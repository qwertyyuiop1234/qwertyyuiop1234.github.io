<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 284" width="760" height="284" role="img" aria-label="The same request timeline with the E2EL span marked from request arrival to the last token out">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "DejaVu Sans", sans-serif; fill: #141413; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 13px; }
    .m { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
    .mu { fill: #64645d; }
    .i { font-style: italic; }
    .tc { fill: #a4502f; } .bl { fill: #35548a; } .sg { fill: #4f6f5c; }
    .oc { fill: #8a6a1f; } .ms { font-size: 13px; } .xl { font-size: 17px; } .lg { font-size: 16px; }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64645d"/></marker>
  </defs>
  <rect width="760" height="284" fill="#faf9f5"/>
  <g stroke-width="1.4">
    <rect x="112" y="14" width="14" height="14" rx="3" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="204" y="14" width="14" height="14" rx="3" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="420" y="14" width="14" height="14" rx="3" fill="#efeee7" stroke="#64645d"/>
  </g>
  <text x="132" y="26" class="s">prefill</text>
