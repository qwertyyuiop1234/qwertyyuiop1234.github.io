  <text x="498" y="198" text-anchor="middle" class="s">tok 2</text>
  <text x="558" y="198" text-anchor="middle" class="s">tok 3</text>
  <text x="618" y="198" text-anchor="middle" class="s">tok 4</text>
  <text x="678" y="198" text-anchor="middle" class="s">tok 5</text>
