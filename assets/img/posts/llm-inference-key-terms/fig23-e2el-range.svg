    <rect x="392" y="54" width="56" height="36" rx="5" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="452" y="54" width="56" height="36" rx="5" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="512" y="54" width="56" height="36" rx="5" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="572" y="54" width="56" height="36" rx="5" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="388" y="106" width="54" height="36" rx="5" fill="#efeee7" stroke="#64645d"/>
    <rect x="448" y="106" width="54" height="36" rx="5" fill="#efeee7" stroke="#64645d"/>
