  <circle cx="498" cy="176" r="4.5" fill="#141413"/>
  <circle cx="558" cy="176" r="4.5" fill="#141413"/>
  <circle cx="618" cy="176" r="4.5" fill="#141413"/>
  <circle cx="678" cy="176" r="4.5" fill="#35548a"/>
