  <text x="440" y="26" class="s">CPU work (detok = detokenize)</text>
  <g stroke="#d8d7d0" stroke-width="1">
    <line x1="20" y1="46" x2="740" y2="46"/>
    <line x1="20" y1="98" x2="740" y2="98"/>
    <line x1="20" y1="150" x2="740" y2="150"/>
  </g>
  <text x="24" y="77" class="b">GPU</text>
  <text x="24" y="129" class="b">CPU</text>
  <g stroke-width="1.4">
