  <g text-anchor="middle" class="s">
    <text x="409" y="167" class="s b">request</text>
    <text x="526" y="167" class="s b">block ids</text>
    <text x="409" y="191" class="s">A</text>
    <text x="409" y="215" class="s">B</text>
  </g>
  <g text-anchor="middle">
    <text x="478" y="191" class="m">7</text>
    <text x="526" y="191" class="m">1</text>
    <text x="574" y="191" class="m">3</text>
    <text x="478" y="215" class="m">2</text>
    <text x="526" y="215" class="m">5</text>
  </g>

  <!-- control arrows -->
  <g stroke="#64645d" stroke-width="1.6" fill="none">
    <path d="M200,92 L200,38 L299,38" marker-end="url(#a-ink)"/>
    <path d="M460,38 L640,38 L640,91" marker-end="url(#a-ink)"/>
    <line x1="520" y1="236" x2="520" y2="299" marker-end="url(#a-ink)"/>
  </g>
  <text x="250" y="30" text-anchor="middle" class="s">block ids</text>
  <text x="550" y="30" text-anchor="middle" class="m">scheduler_output</text>
  <text x="530" y="272" class="s">points to physical blocks</text>

  <!-- GPU memory: physical blocks -->
  <rect x="16" y="300" width="728" height="108" rx="8" fill="#faf9f5" stroke="#64645d" stroke-width="1.4"/>
  <text x="290" y="322" class="b">GPU memory</text>
  <text x="392" y="322" class="s mu">· physical KV blocks, block size = 4 tokens</text>
