<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-label="vLLM KV management: the KV manager hands block ids to the scheduler, the model runner's block table points to physical blocks, and slot_mapping picks the exact slot">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "DejaVu Sans", sans-serif; fill: #141413; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 13px; }
    .m { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
    .mu { fill: #64645d; }
    .i { font-style: italic; }
    .tc { fill: #a4502f; } .bl { fill: #35548a; } .sg { fill: #4f6f5c; }
    .oc { fill: #8a6a1f; }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64645d"/></marker>
    <marker id="a-tc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a4502f"/></marker>
  </defs>
  <rect width="760" height="424" fill="#faf9f5"/>

  <!-- scheduler -->
  <rect x="300" y="16" width="160" height="44" rx="6" fill="#efeee7" stroke="#64645d" stroke-width="1.4"/>
  <text x="380" y="43" text-anchor="middle" class="b">Scheduler</text>

  <!-- KV manager with KV pool (logical blocks) -->
  <rect x="16" y="92" width="294" height="144" rx="8" fill="#efeee7" stroke="#64645d" stroke-width="1.4"/>
  <text x="30" y="116" class="b">KV manager</text>
  <rect x="28" y="128" width="270" height="88" rx="5" fill="#faf9f5" stroke="#64645d" stroke-width="1.4"/>
  <text x="42" y="147" class="s"><tspan class="b">KV pool</tspan> · logical blocks of request A</text>
  <g stroke-width="1.4">
    <rect x="42.5" y="174" width="18" height="28" fill="#f0e3bf" stroke="#8a6a1f"/>
    <rect x="60.5" y="174" width="18" height="28" fill="#f0e3bf" stroke="#8a6a1f"/>
