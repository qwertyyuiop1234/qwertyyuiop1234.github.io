<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" width="760" height="416" role="img" aria-label="Two-stage pipeline timelines: whole prefills leave large idle bubbles, while chunked prefill with piggybacked decodes leaves smaller bubbles and finishes earlier">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "DejaVu Sans", sans-serif; fill: #141413; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 13px; }
    .m { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
    .mu { fill: #64645d; }
    .i { font-style: italic; }
    .tc { fill: #a4502f; } .bl { fill: #35548a; } .sg { fill: #4f6f5c; }
    .sl { fill: #414b48; }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64645d"/></marker>
    <marker id="a-sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f6f5c"/></marker>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#efeee7"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#64645d" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="760" height="416" fill="#faf9f5"/>

  <!-- ===== (a) without chunking ===== -->
  <text x="20" y="28" class="b">(a) Without chunking</text>
  <text x="196" y="28" class="s mu">whole prefills run first, decodes wait</text>
  <text x="92" y="68" text-anchor="end" class="s mu">GPU</text>
  <text x="92" y="86" text-anchor="end">stage 1</text>
  <text x="92" y="120" text-anchor="end" class="s mu">GPU</text>
  <text x="92" y="138" text-anchor="end">stage 2</text>

  <g transform="translate(-16,0)">
  <g stroke-width="1.4">
    <!-- stage 1 -->
    <rect x="120" y="50" width="96" height="44" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="216" y="50" width="144" height="44" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="360" y="50" width="48" height="44" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="408" y="50" width="96" height="44" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="504" y="50" width="36" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="504" y="72" width="36" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="540" y="50" width="108" height="44" fill="url(#hatch)" stroke="#64645d"/>
    <rect x="648" y="50" width="36" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="648" y="72" width="36" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <!-- stage 2 -->
    <rect x="216" y="102" width="96" height="44" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="312" y="102" width="48" height="44" fill="url(#hatch)" stroke="#64645d"/>
    <rect x="360" y="102" width="144" height="44" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="504" y="102" width="48" height="44" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="552" y="102" width="96" height="44" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="648" y="102" width="36" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="648" y="124" width="36" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="684" y="102" width="36" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="684" y="124" width="36" height="22" fill="#d9e1ee" stroke="#35548a"/>
  </g>
  <g text-anchor="middle">
    <text x="168" y="77">Ap</text>
    <text x="288" y="77">Bp</text>
    <text x="384" y="77">Cp</text>
    <text x="456" y="77">Dp</text>
    <text x="264" y="129">Ap</text>
    <text x="432" y="129">Bp</text>
    <text x="528" y="129">Cp</text>
    <text x="600" y="129">Dp</text>
  </g>
  <g text-anchor="middle">
    <text x="522" y="66" class="s">Ad</text>
    <text x="522" y="88" class="s">Bd</text>
    <text x="666" y="66" class="s">Cd</text>
    <text x="666" y="88" class="s">Dd</text>
    <text x="666" y="118" class="s">Ad</text>
    <text x="666" y="140" class="s">Bd</text>
    <text x="702" y="118" class="s">Cd</text>
    <text x="702" y="140" class="s">Dd</text>
  </g>
  <!-- bubble labels -->
  <rect x="566" y="63" width="56" height="18" rx="3" fill="#faf9f5"/>
  <text x="594" y="77" text-anchor="middle" class="s i mu">bubble</text>
  <text x="336" y="164" text-anchor="middle" class="s i mu">bubble</text>

  </g>

  <!-- ===== (b) chunked prefill + decode piggybacking ===== -->
  <line x1="20" y1="178" x2="740" y2="178" stroke="#d8d7d0" stroke-width="1"/>
  <text x="20" y="202" class="b">(b) Chunked prefill + decode piggybacking</text>
  <text x="372" y="202" class="s mu">small chunks, decodes ride along</text>
  <text x="92" y="232" text-anchor="end" class="s mu">GPU</text>
  <text x="92" y="250" text-anchor="end">stage 1</text>
  <text x="92" y="288" text-anchor="end" class="s mu">GPU</text>
  <text x="92" y="306" text-anchor="end">stage 2</text>

  <g transform="translate(-16,0)">
  <g stroke-width="1.4">
    <!-- stage 1 -->
    <rect x="120" y="212" width="48" height="48" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="168" y="212" width="48" height="48" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="216" y="212" width="48" height="48" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="264" y="212" width="48" height="48" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="312" y="212" width="48" height="26" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="312" y="238" width="48" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="360" y="212" width="48" height="48" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="408" y="212" width="48" height="26" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="408" y="238" width="48" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="456" y="212" width="48" height="26" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="456" y="238" width="48" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="504" y="212" width="48" height="48" fill="url(#hatch)" stroke="#64645d"/>
    <rect x="552" y="212" width="36" height="48" fill="#d9e1ee" stroke="#35548a"/>
    <!-- stage 2 -->
    <rect x="168" y="268" width="48" height="48" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="216" y="268" width="48" height="48" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="264" y="268" width="48" height="48" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="312" y="268" width="48" height="48" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="360" y="268" width="48" height="26" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="360" y="294" width="48" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="408" y="268" width="48" height="48" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="456" y="268" width="48" height="26" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="456" y="294" width="48" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="504" y="268" width="48" height="26" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="504" y="294" width="48" height="22" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="552" y="268" width="36" height="48" fill="url(#hatch)" stroke="#64645d"/>
    <rect x="588" y="268" width="36" height="48" fill="#d9e1ee" stroke="#35548a"/>
  </g>
  <g text-anchor="middle">
    <text x="144" y="241">Ap1</text>
    <text x="192" y="241">Bp1</text>
    <text x="240" y="241">Ap2</text>
    <text x="288" y="241">Bp2</text>
    <text x="336" y="230">Cp1</text>
    <text x="384" y="241">Bp3</text>
    <text x="432" y="230">Dp1</text>
    <text x="480" y="230">Dp2</text>
    <text x="192" y="297">Ap1</text>
    <text x="240" y="297">Bp1</text>
    <text x="288" y="297">Ap2</text>
    <text x="336" y="297">Bp2</text>
    <text x="384" y="286">Cp1</text>
    <text x="432" y="297">Bp3</text>
    <text x="480" y="286">Dp1</text>
    <text x="528" y="286">Dp2</text>
  </g>
  <g text-anchor="middle">
    <text x="336" y="254" class="s">Ad</text>
    <text x="432" y="254" class="s">Cd</text>
    <text x="480" y="254" class="s">Bd</text>
    <text x="570" y="241" class="s">Dd</text>
    <text x="384" y="310" class="s">Ad</text>
    <text x="480" y="310" class="s">Cd</text>
    <text x="528" y="310" class="s">Bd</text>
    <text x="606" y="297" class="s">Dd</text>
  </g>
  <text x="546" y="334" text-anchor="middle" class="s i mu">smaller bubbles</text>

  <!-- finish lines -->
  <g stroke="#414b48" stroke-width="1.4" stroke-dasharray="5 4">
    <line x1="720" y1="44" x2="720" y2="348"/>
    <line x1="624" y1="210" x2="624" y2="348"/>
  </g>
  <line x1="626" y1="300" x2="718" y2="300" stroke="#4f6f5c" stroke-width="1.6" marker-start="url(#a-sg)" marker-end="url(#a-sg)"/>
  <text x="672" y="291" text-anchor="middle" class="s i sg">earlier</text>

  <!-- time axis -->
  <line x1="120" y1="352" x2="738" y2="352" stroke="#64645d" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="120" y="372" class="s mu">time</text>
  <text x="624" y="372" text-anchor="middle" class="s b sl">(b) finish</text>
  <text x="720" y="372" text-anchor="middle" class="s b sl">(a) finish</text>

  <!-- legend -->
  <g stroke-width="1.4">
    <rect x="120" y="390" width="22" height="14" fill="#ecd5c8" stroke="#a4502f"/>
    <rect x="270" y="390" width="22" height="14" fill="#d9e1ee" stroke="#35548a"/>
    <rect x="420" y="390" width="22" height="14" fill="url(#hatch)" stroke="#64645d"/>
  </g>
  <g>
    <text x="148" y="401" class="s">prefill (Xp)</text>
    <text x="298" y="401" class="s">decode (Xd)</text>
    <text x="448" y="401" class="s">bubble: stage idle</text>
  </g>
  </g>
</svg>
