<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="760" height="340" role="img" aria-label="PD aggregation runs prefill and decode in one instance with one shared KV cache, PD disaggregation runs them in separate instances and transfers the KV cache">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "DejaVu Sans", sans-serif; fill: #141413; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 13px; }
    .m { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
    .mu { fill: #64645d; }
    .i { font-style: italic; }
    .tc { fill: #a4502f; } .bl { fill: #35548a; } .sg { fill: #4f6f5c; }
    .t16 { font-size: 16px; }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64645d"/></marker>
    <marker id="a-bl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#35548a"/></marker>
    <marker id="a-sg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4f6f5c"/></marker>
  </defs>
  <rect width="760" height="340" fill="#faf9f5"/>

  <!-- ===== left: PD aggregation ===== -->
  <text x="168" y="34" text-anchor="middle" class="b t16">PD aggregation</text>
  <rect x="28" y="56" width="280" height="262" rx="8" fill="#efeee7" stroke="#64645d" stroke-width="1.4"/>
  <text x="42" y="80" class="s mu">one model instance</text>

  <rect x="44" y="130" width="110" height="48" rx="6" fill="#ecd5c8" stroke="#a4502f" stroke-width="1.4"/>
  <text x="99" y="159" text-anchor="middle" class="b">Prefill</text>
  <rect x="182" y="130" width="110" height="48" rx="6" fill="#d9e1ee" stroke="#35548a" stroke-width="1.4"/>
  <text x="237" y="159" text-anchor="middle" class="b">Decode</text>
  <line x1="154" y1="154" x2="181" y2="154" stroke="#64645d" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <!-- decode loop -->
  <path d="M262,130 C262,100 212,100 212,129" fill="none" stroke="#35548a" stroke-width="1.8" marker-end="url(#a-bl)"/>
  <text x="237" y="98" text-anchor="middle" class="s i bl">one token per step</text>

  <rect x="44" y="256" width="248" height="44" rx="6" fill="#f0e3bf" stroke="#8a6a1f" stroke-width="1.4"/>
  <text x="168" y="283" text-anchor="middle" class="b">KV cache (shared)</text>
  <line x1="99" y1="178" x2="99" y2="255" stroke="#64645d" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="108" y="222" class="s mu">write</text>
  <line x1="237" y1="179" x2="237" y2="255" stroke="#64645d" stroke-width="1.6" marker-start="url(#a-ink)" marker-end="url(#a-ink)"/>
  <text x="246" y="222" class="s mu">read</text>
  <text x="246" y="238" class="s mu">+ write</text>

  <line x1="336" y1="20" x2="336" y2="324" stroke="#64645d" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- ===== right: PD disaggregation ===== -->
  <text x="548" y="34" text-anchor="middle" class="b t16">PD disaggregation</text>

  <!-- prefill instance -->
  <rect x="364" y="56" width="368" height="98" rx="8" fill="#efeee7" stroke="#64645d" stroke-width="1.4"/>
  <text x="378" y="78" class="s mu">prefill instance</text>
  <rect x="380" y="92" width="120" height="48" rx="6" fill="#ecd5c8" stroke="#a4502f" stroke-width="1.4"/>
  <text x="440" y="121" text-anchor="middle" class="b">Prefill</text>
  <rect x="588" y="92" width="128" height="48" rx="6" fill="#f0e3bf" stroke="#8a6a1f" stroke-width="1.4"/>
  <text x="652" y="121" text-anchor="middle" class="b">KV cache</text>
  <line x1="500" y1="116" x2="587" y2="116" stroke="#64645d" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <text x="544" y="108" text-anchor="middle" class="s mu">write</text>

  <!-- decode instance -->
  <rect x="364" y="198" width="368" height="120" rx="8" fill="#efeee7" stroke="#64645d" stroke-width="1.4"/>
  <text x="378" y="220" class="s mu">decode instance</text>
  <rect x="380" y="256" width="120" height="48" rx="6" fill="#d9e1ee" stroke="#35548a" stroke-width="1.4"/>
  <text x="440" y="285" text-anchor="middle" class="b">Decode</text>
  <rect x="588" y="256" width="128" height="48" rx="6" fill="#f0e3bf" stroke="#8a6a1f" stroke-width="1.4"/>
  <text x="652" y="285" text-anchor="middle" class="b">KV cache</text>
  <line x1="587" y1="280" x2="501" y2="280" stroke="#64645d" stroke-width="1.6" marker-start="url(#a-ink)" marker-end="url(#a-ink)"/>
  <text x="544" y="270" text-anchor="middle" class="s mu">read + write</text>
  <!-- decode loop -->
  <path d="M465,256 C465,226 415,226 415,255" fill="none" stroke="#35548a" stroke-width="1.8" marker-end="url(#a-bl)"/>
  <text x="478" y="238" class="s i bl">one token per step</text>

  <!-- KV cache transfer -->
  <line x1="652" y1="140" x2="652" y2="255" stroke="#4f6f5c" stroke-width="1.8" marker-end="url(#a-sg)"/>
  <text x="640" y="180" text-anchor="end" class="b sg">KV cache transfer</text>
</svg>
