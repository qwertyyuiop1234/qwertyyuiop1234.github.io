<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300" role="img" aria-label="Prefill multiplies a whole token matrix by the weights, decode multiplies one token vector by the weights and also reads the KV cache">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "DejaVu Sans", sans-serif; fill: #141413; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 13px; }
    .m { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
    .mu { fill: #64645d; }
    .i { font-style: italic; }
    .tc { fill: #a4502f; } .bl { fill: #35548a; } .sg { fill: #4f6f5c; }
    .xl { font-size: 17px; }
    .op { font-size: 22px; fill: #64645d; }
  </style>
  <rect width="760" height="300" fill="#faf9f5"/>

  <!-- panel titles -->
  <text x="190" y="34" text-anchor="middle" class="b xl tc">Prefill: compute-bound</text>
  <text x="570" y="34" text-anchor="middle" class="b xl bl">Decode: memory-bandwidth-bound</text>
  <line x1="380" y1="16" x2="380" y2="286" stroke="#64645d" stroke-width="1.2" stroke-dasharray="5 4"/>

  <!-- prefill: N x d tokens times d x d weights -->
  <rect x="28" y="62" width="46" height="150" fill="#ecd5c8" stroke="#a4502f" stroke-width="1.4"/>
  <text x="51" y="142" text-anchor="middle" class="m">N×d</text>
  <text x="51" y="236" text-anchor="middle">N tokens</text>
  <text x="92" y="145" text-anchor="middle" class="op">×</text>
  <rect x="110" y="62" width="146" height="150" fill="#d9e1ee" stroke="#35548a" stroke-width="1.4"/>
  <text x="183" y="132" text-anchor="middle">weights W</text>
  <text x="183" y="156" text-anchor="middle" class="m">d×d</text>
  <text x="270" y="118" class="i tc">read W once,</text>
  <text x="270" y="140" class="i tc">use it</text>
  <text x="270" y="162" class="i tc">N times</text>
  <text x="190" y="272" text-anchor="middle" class="m">multiply ≈ N·d²<tspan dx="24">read ≈ d²</tspan></text>

  <!-- decode: 1 x d vector times W, plus KV cache -->
  <rect x="410" y="129" width="46" height="16" fill="#ecd5c8" stroke="#a4502f" stroke-width="1.4"/>
  <text x="433" y="168" text-anchor="middle" class="m">1×d</text>
  <text x="433" y="236" text-anchor="middle">1 token</text>
  <text x="474" y="145" text-anchor="middle" class="op">×</text>
  <rect x="492" y="62" width="146" height="150" fill="#d9e1ee" stroke="#35548a" stroke-width="1.4"/>
  <text x="565" y="132" text-anchor="middle">weights W</text>
  <text x="565" y="156" text-anchor="middle" class="m">d×d</text>
  <g fill="#f0e3bf" stroke="#8a6a1f" stroke-width="1.4">
    <rect x="662" y="62" width="60" height="25"/>
    <rect x="662" y="87" width="60" height="25"/>
    <rect x="662" y="112" width="60" height="25"/>
    <rect x="662" y="137" width="60" height="25"/>
    <rect x="662" y="162" width="60" height="25"/>
    <rect x="662" y="187" width="60" height="25"/>
  </g>
  <text x="692" y="236" text-anchor="middle">KV cache</text>
  <text x="570" y="272" text-anchor="middle" class="m">multiply ≈ d²<tspan dx="24">read ≈ d² + whole KV</tspan></text>
</svg>
