<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 610" width="760" height="610" role="img" aria-label="Function calling in five steps between the app and the model, using a get_weather tool for Seoul">
  <style>
    text { font-family: "Helvetica Neue", Helvetica, Arial, "DejaVu Sans", sans-serif; fill: #141413; font-size: 15px; }
    .b { font-weight: 700; }
    .s { font-size: 13px; }
    .m { font-family: "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 14px; }
    .mu { fill: #64645d; }
    .i { font-style: italic; }
    .tc { fill: #a4502f; } .bl { fill: #35548a; } .sg { fill: #4f6f5c; }
    .oc { fill: #8a6a1f; }
    .w { fill: #faf9f5; }
  </style>
  <defs>
    <marker id="a-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#64645d"/></marker>
  </defs>
  <rect width="760" height="610" fill="#faf9f5"/>

  <!-- lanes -->
  <rect x="20" y="16" width="260" height="578" rx="8" fill="#efeee7" stroke="#64645d" stroke-width="1.4"/>
  <rect x="610" y="16" width="130" height="578" rx="8" fill="#d9e1ee" stroke="#35548a" stroke-width="1.4"/>
  <text x="150" y="42" text-anchor="middle" class="b">Developer / app</text>
  <text x="675" y="42" text-anchor="middle" class="b">Model</text>
  <line x1="36" y1="54" x2="264" y2="54" stroke="#64645d" stroke-width="1"/>
  <line x1="624" y1="54" x2="726" y2="54" stroke="#35548a" stroke-width="1"/>
  <text x="150" y="80" text-anchor="middle" class="s i mu">defines the tools,</text>
  <text x="150" y="96" text-anchor="middle" class="s i mu">runs them locally</text>
  <text x="675" y="80" text-anchor="middle" class="s i bl">never runs code,</text>
  <text x="675" y="96" text-anchor="middle" class="s i bl">only writes text</text>

  <!-- step 1 -->
  <circle cx="300" cy="74" r="11" fill="#414b48"/>
  <text x="300" y="78.5" text-anchor="middle" class="s b w">1</text>
  <text x="318" y="79" class="s mu">tool definition + user question</text>
  <rect x="318" y="90" width="188" height="28" rx="5" fill="#faf9f5" stroke="#64645d" stroke-width="1.4"/>
  <text x="330" y="109" class="m">get_weather(city)</text>
  <rect x="318" y="124" width="204" height="28" rx="5" fill="#d9e1ee" stroke="#35548a" stroke-width="1.4"/>
  <text x="330" y="143">Is it cold in Seoul now?</text>
  <line x1="280" y1="168" x2="609" y2="168" stroke="#64645d" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <!-- step 2 -->
  <circle cx="300" cy="194" r="11" fill="#414b48"/>
  <text x="300" y="198.5" text-anchor="middle" class="s b w">2</text>
  <text x="318" y="199" class="s mu">model returns a tool call, not an answer</text>
  <rect x="318" y="210" width="264" height="28" rx="5" fill="#f0e3bf" stroke="#8a6a1f" stroke-width="1.4"/>
  <text x="330" y="229" class="m">get_weather(city="Seoul")</text>
  <text x="318" y="258" class="s i oc">guided decoding can keep this format valid</text>
  <line x1="610" y1="274" x2="281" y2="274" stroke="#64645d" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <!-- step 3: inside the app lane -->
  <rect x="32" y="290" width="236" height="120" rx="6" fill="#faf9f5" stroke="#64645d" stroke-width="1.4"/>
  <circle cx="56" cy="312" r="11" fill="#414b48"/>
  <text x="56" y="316.5" text-anchor="middle" class="s b w">3</text>
  <text x="74" y="317" class="s mu">app runs the function</text>
  <rect x="42" y="328" width="216" height="26" rx="5" fill="#efeee7" stroke="#64645d" stroke-width="1.4"/>
  <text x="150" y="346" text-anchor="middle" class="m">get_weather("Seoul")</text>
  <line x1="150" y1="354" x2="150" y2="371" stroke="#64645d" stroke-width="1.6" marker-end="url(#a-ink)"/>
  <rect x="73" y="372" width="154" height="26" rx="5" fill="#efeee7" stroke="#64645d" stroke-width="1.4"/>
  <text x="150" y="390" text-anchor="middle" class="m">{"temp_c": 9}</text>

  <!-- step 4 -->
  <circle cx="300" cy="430" r="11" fill="#414b48"/>
  <text x="300" y="434.5" text-anchor="middle" class="s b w">4</text>
  <text x="318" y="435" class="s mu">send the result back</text>
  <rect x="318" y="446" width="154" height="28" rx="5" fill="#faf9f5" stroke="#64645d" stroke-width="1.4"/>
  <text x="330" y="465" class="m">{"temp_c": 9}</text>
  <line x1="280" y1="490" x2="609" y2="490" stroke="#64645d" stroke-width="1.6" marker-end="url(#a-ink)"/>

  <!-- step 5 -->
  <circle cx="300" cy="516" r="11" fill="#414b48"/>
  <text x="300" y="520.5" text-anchor="middle" class="s b w">5</text>
  <text x="318" y="521" class="s mu">model writes the final answer</text>
  <rect x="318" y="532" width="186" height="44" rx="5" fill="#d9e3d9" stroke="#4f6f5c" stroke-width="1.4"/>
  <text x="330" y="550">It is 9 °C in Seoul,</text>
  <text x="330" y="568">so take a jacket.</text>
  <line x1="610" y1="584" x2="281" y2="584" stroke="#64645d" stroke-width="1.6" marker-end="url(#a-ink)"/>
</svg>
