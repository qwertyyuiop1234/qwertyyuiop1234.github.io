<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 636" width="760" height="636" role="img" aria-label="Six snapshots of a RadixAttention prefix tree: chats share the system prompt node, reused paths turn blue, and the least recently used leaf is evicted when memory is full">
